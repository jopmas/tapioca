      <title
         id="title_setup">Model setup</title>
      <desc
         id="desc_setup">Lx = 1200 km
Lz = 400 km
dx = 1 km
dz = 1 km
regime = rifting
velocity = 0.5 cm/yr   # 0.25 cm/yr at each side
moving_boundary = symmetric
time_max = 70 Myr
# water_layer = water           # only with sp_format = SP_vc: template below the domain, zero thickness below the air
# magmatism (off here): the melt extracted by Mandyoc goes to the template extrusive_basalt
# magmatism = on
# magmatism_extraction = on
# magmatic_layer = extrusive_basalt
# surface processes
sp_surface_processes = True
sp_mode = theunissen_sedimentation
sp_format = ggciag              # ggciag (default; sediment_layers.txt, sedimentation_rate.txt) or SP_vc (mandyoc_tests, Hypatia)
sediment_layer = sediments      # template below the domain: one layer of zero thickness every dt_sed
ti_sed = 0 Myr
# tf_sed = 70 Myr               (default: time_max; before time_max, the sedimentation stops there)
dt_sed = 1 Myr
sedimentation_rate = 25         # m2/yr; or in steps: 0 Myr: 25, 20 Myr: 50, 40 Myr: 10
Ld = 35 km                      # sediment dispersion length (fixed at 35 km in the Mandyoc of ggciag)
base_level = -500 m
sp_d_c = 1.0
strain_sed = 0.25
continental_slope = 2.0
a2l = True
plot_sediment = False
surface_particles_per_element = 50
air_threshold_density = 1100.0</desc>
