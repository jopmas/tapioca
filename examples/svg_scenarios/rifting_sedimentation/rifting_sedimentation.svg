<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Symmetric rifting with sedimentation (theunissen_sedimentation), as the scenario 0.25cm_35km_lc0.5.
     1 user unit = 1 km; the setup shape is the model domain (1200 x 400 km). The crust is 5 km thicker at the
     centre (cosine). The shapes in the "templates" layer are drawn below the domain: they only give the material of
     layers of zero thickness added by tapioca: the 70 layers of sediments deposited by Mandyoc (sediment_layer), the
     water (water_layer, only with sp_format = SP_vc) and, with magmatism_extraction = on, the extrusive basalt
     (magmatic_layer). sp_format = ggciag (default) writes sediment_layers.txt and sedimentation_rate.txt for the
     Mandyoc of ggciag; sp_format = SP_vc writes SP_vc.txt for the Mandyoc with the sedimentation of Theunissen
     (mandyoc_tests, on Hypatia); with sp_format = SP_vc and water_layer = water, the inputs of 0.25cm_35km_lc0.5. -->

